<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- No viewport-fit=cover: it makes every env(safe-area-inset-*) non-zero, including the BOTTOM
         (home-indicator strip on Face-ID iPads), while apple-mobile-web-app-status-bar-style=black
         only reserves the top. The app does no safe-area padding and pins its status bar and playbar
         to the bottom, so cover would push them under the swipe strip — and with an opaque status bar
         it buys nothing in return. Add it back only together with env(safe-area-inset-*) handling. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>slop-animator</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Tab icon is the star alone; the full "slop" logotype is unreadable at 32px. Declaring both
         means no browser falls back to requesting /favicon.ico: SVG where supported, PNG elsewhere.
         Both are generated from public/*.svg by tools/make-icons.mjs. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="slop" />
    <meta name="theme-color" content="#1e1e1e" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
